[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agr-data-crypto"
version = "0.1.0"
description = "Continuous Binance/Bybit OHLCV collection on GitHub Actions with lease-based handoff"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "redis>=5,<9",
    "websockets>=13,<18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "fakeredis[lua]>=2.30",
    "ruff>=0.6",
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
