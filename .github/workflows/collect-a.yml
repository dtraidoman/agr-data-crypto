name: collect-a

# Role alpha: primary Binance, takes over Bybit only if bravo's heartbeat dies.
# Starts on the hour and stops itself 3h50m later, leaving a 10 minute hole
# that the next run closes from the cursor via REST backfill.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running collector: a half-collected stream is better than a
# killed one, and the successor already handles overlap.
concurrency:
  group: collector-alpha
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 265
    env:
      PYTHONPATH: src
      COLLECTOR_ROLE: alpha
      # run_attempt is part of the lease token: two attempts of the same run
      # must never look like the same holder.
      COLLECTOR_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      COLLECTOR_INTERVAL: 1m
      COLLECTOR_SOFT_DEADLINE_SEC: "13800"
      COLLECTOR_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
      COLLECTOR_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      COLLECTOR_SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COLLECTOR_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      COLLECTOR_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Collect
        run: python -m collector.main

      - name: Continuity report
        # Informational: the peer may legitimately be behind while this job
        # exits, so a red step would be noise. The watchdog alerts on real gaps.
        if: always()
        continue-on-error: true
        run: python scripts/verify_continuity.py --window-minutes 260

      - name: Summary
        if: always()
        run: |
          {
            echo "## collect-a (Binance primary)"
            echo ""
            echo "- run: ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            echo "- soft deadline: 3h50m"
            echo "- job conclusion: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
