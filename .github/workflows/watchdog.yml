name: watchdog

# Independent of both collectors. A scheduled workflow can fire late or stop
# firing silently, so the watchdog checks heartbeats and dispatches the
# collectors through the GitHub API. Token-triggered dispatches do start runs.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COLLECTOR_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        # The watchdog must run even if the collector package is broken.
        run: pip install -r requirements.txt

      - name: Check and revive
        run: python scripts/watchdog.py
