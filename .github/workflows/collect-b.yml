name: collect-b

# Role bravo: primary Bybit, takes over Binance only if alpha's heartbeat dies.
# Offset by 10 minutes so the two roles never fight over a cold start.
on:
  schedule:
    - cron: "10 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collector-bravo
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 265
    env:
      PYTHONPATH: src
      COLLECTOR_ROLE: bravo
      COLLECTOR_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      COLLECTOR_INTERVAL: 1m
      COLLECTOR_SOFT_DEADLINE_SEC: "13800"
      COLLECTOR_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
      COLLECTOR_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      COLLECTOR_SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COLLECTOR_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      COLLECTOR_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Collect
        run: python -m collector.main

      - name: Continuity report
        if: always()
        continue-on-error: true
        run: python scripts/verify_continuity.py --window-minutes 260

      - name: Summary
        if: always()
        run: |
          {
            echo "## collect-b (Bybit primary)"
            echo ""
            echo "- run: ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            echo "- soft deadline: 3h50m"
            echo "- job conclusion: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
