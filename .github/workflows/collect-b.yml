name: collect-b

# Role bravo: primary Bybit, secondary Binance. It starts ten minutes after
# alpha so a missing or dead alpha is covered without a simultaneous race.
# The job intentionally overlaps its successor: the successor waits on the
# Redis lease while the predecessor keeps streaming.
on:
  schedule:
    - cron: "10 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
      COLLECTOR_ROLE: bravo
      COLLECTOR_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      COLLECTOR_SOFT_DEADLINE_SEC: "16200"
      COLLECTOR_LEASE_TTL_MS: "180000"
      COLLECTOR_HEARTBEAT_SEC: "60"
      COLLECTOR_TAKEOVER_POLL_SEC: "60"
      COLLECTOR_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
      COLLECTOR_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      COLLECTOR_SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COLLECTOR_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      COLLECTOR_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Collect
        run: python -m collector.main
